name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-check:
    name: Compile check (no native)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.1
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK without native code
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug -PskipNative --stacktrace --console=plain

      - name: Run host unit tests
        run: ./gradlew :app:testDebugUnitTest -PskipNative --stacktrace --console=plain

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ananbox-debug-no-native
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  native-build:
    name: Full NDK build
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.1
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;30.0.3" \
            "build-tools;33.0.0" \
            "cmake;3.22.1" \
            "ndk;23.1.7779620"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build python3

      - name: Cache Boost sources
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/boost
          key: boost-1.83.0-${{ runner.os }}

      - name: Cache talloc source archive
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/.cache/downloads
          key: talloc-2.4.1-${{ runner.os }}-v1

      - name: Prefetch talloc source archive
        run: |
          set -eu
          out=app/src/main/cpp/.cache/downloads/talloc-2.4.1.tar.gz
          hash=410a547f08557007be0e88194f218868358edc0ab98c98ba8c167930db3d33f9
          mkdir -p "$(dirname "$out")"
          if [ -f "$out" ] && echo "$hash  $out" | sha256sum -c - >/dev/null 2>&1; then
            echo "talloc archive restored from cache"
            exit 0
          fi
          for url in \
            https://download.samba.org/pub/talloc/talloc-2.4.1.tar.gz \
            https://www.samba.org/ftp/talloc/talloc-2.4.1.tar.gz \
            https://ftp.samba.org/pub/talloc/talloc-2.4.1.tar.gz ; do
            echo "Downloading $url"
            if curl --http1.1 -fLsS --retry 5 --retry-all-errors --retry-delay 2 \
                --connect-timeout 20 --max-time 300 -o "$out" "$url" &&
               echo "$hash  $out" | sha256sum -c - ; then
              echo "talloc archive downloaded and verified"
              exit 0
            fi
            rm -f "$out"
          done
          echo "::warning::talloc prefetch failed; CMake will retry its URL list during the build"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (NDK, both ABIs)
        run: |
          chmod +x ./gradlew
          chmod +x app/src/main/cpp/anbox/scripts/gen-emugl-headers.sh \
            app/src/main/cpp/anbox/scripts/gen-emugl-entries.py
          ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ananbox-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  mcp-selftest:
    name: MCP bridge self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Anna MCP tests
        run: python3 -m unittest discover -s tools/anna-mcp -p 'test_*.py' -v

  cpp-selftest:
    name: Binder manifest self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and run binder manifest tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I app/src/main/cpp \
            app/src/main/cpp/tests/binder_manifest_test.cpp -o /tmp/binder_manifest_test
          /tmp/binder_manifest_test
