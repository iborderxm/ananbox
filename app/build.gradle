plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// `-PskipNative` lets CI compile Kotlin/resources/manifest without the NDK
// toolchain (fast feedback). Full builds keep the native pipeline.
def skipNative = project.hasProperty("skipNative")

android {
    namespace 'com.github.ananbox'
    compileSdk 33

    defaultConfig {
        applicationId "com.github.ananbox"
        minSdk 23
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        if (!skipNative) {
            ndk {
                abiFilters 'x86_64', 'arm64-v8a'
            }

            externalNativeBuild {
                cmake {
                    targets "anbox", "proot"
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    if (!skipNative) {
        externalNativeBuild {
            cmake {
                path file('src/main/cpp/CMakeLists.txt')
                version '3.22.1'
            }
        }
    }
    buildFeatures {
        viewBinding true
        aidl true
        // AnnaRoutes uses BuildConfig.DEBUG to disable bearer auth in debug builds.
        buildConfig true
    }
    testOptions {
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed"
            }
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// The ROM start script (root/run.sh) is needed to launch the container. The
// ROM build copies it into the image, but a third-party ROM archive may omit
// it; bundle the very same file in the APK so the App can supply it. Keeping
// a single source (src/main/cpp/anbox/scripts/run.sh) means the ROM build
// and the App fallback cannot drift apart.
def romAssetsDir = file("$buildDir/generated/romAssets")

tasks.register('copyRomRunScript', Copy) {
    from('src/main/cpp/anbox/scripts/run.sh')
    into romAssetsDir
}

android {
    sourceSets {
        main {
            assets.srcDirs += romAssetsDir
        }
    }
}

tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn 'copyRomRunScript'
}

dependencies {

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.fpliu.ndk.pkg.prefab.android.21:libpng:1.6.37'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation 'com.github.hzy3774:AndroidP7zip:v1.7.2'
}